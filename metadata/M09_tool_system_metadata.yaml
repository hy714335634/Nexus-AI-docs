core_features:
- 工具函数装饰器
- 工具注册和发现
- 工具动态加载
- 工具依赖管理
- 工具模板系统
- 工具自动生成
- Strands工具集成
- MCP工具集成
tool_types:
  strands_builtin:
    description: Strands框架内置工具
    examples:
    - calculator
    - shell
    - file_operations
  system_tools:
    description: 系统级自定义工具
    examples:
    - project_manager
    - multimodal_content_parser
    - agent_template_provider
  mcp_tools:
    description: MCP协议工具
    examples:
    - aws_api
    - strands_agents
  generated_tools:
    description: 自动生成的工具
    examples:
    - aws_pricing_tools
integration_points:
  agent_factory: Agent Factory加载和注册工具
  prompt_manager: 从提示词模板获取工具依赖
  mcp_manager: 集成MCP工具
  strands_framework: 使用Strands工具系统
tool_development_workflow:
  step1: 定义工具函数并使用@tool装饰器
  step2: 在工具模板提供器中注册工具
  step3: 在Agent提示词中声明工具依赖
  step4: Agent Factory自动加载和集成工具
