mcp_configurations:
  config_directory: mcp/
  total_configs: 2
  config_files:
  - file: system_mcp_server.json
    path: mcp/system_mcp_server.json
    mcpServers:
    - awslabs.core-mcp-server
    - awslabs.aws-pricing-mcp-server
    - awslabs.aws-api-mcp-server
  - file: public_mcp_server.json
    path: mcp/public_mcp_server.json
    mcpServers:
    - test-server
    - disabled-server
mcp_servers:
- name: awslabs.core-mcp-server
  command: uvx
  args:
  - awslabs.core-mcp-server@latest
  env:
    FASTMCP_LOG_LEVEL: ERROR
  autoApprove: []
  config_file: system_mcp_server.json
- name: awslabs.aws-pricing-mcp-server
  command: uvx
  args:
  - awslabs.aws-pricing-mcp-server@latest
  env:
    FASTMCP_LOG_LEVEL: ERROR
    AWS_PROFILE: default
    AWS_REGION: us-east-1
  autoApprove: []
  config_file: system_mcp_server.json
- name: awslabs.aws-api-mcp-server
  command: uvx
  args:
  - awslabs.aws-api-mcp-server@latest
  env:
    FASTMCP_LOG_LEVEL: ERROR
    AWS_PROFILE: default
    AWS_REGION: us-west-2
  autoApprove: []
  config_file: system_mcp_server.json
- name: test-server
  command: uvx
  args:
  - test-package@latest
  env:
    TEST_ENV: test_value
  autoApprove:
  - test-tool
  config_file: public_mcp_server.json
- name: disabled-server
  command: uvx
  args:
  - disabled-package@latest
  env: {}
  autoApprove: []
  config_file: public_mcp_server.json
