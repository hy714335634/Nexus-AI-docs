version_management:
  description: 版本管理机制
  features:
  - 支持多版本并存
  - 自动选择latest版本
  - 语义化版本号比较
  - 版本状态管理(stable/beta/deprecated)
  - 版本创建日期和作者追踪
  version_selection_logic:
    latest_keyword: 优先返回名为"latest"的版本
    semantic_versioning: 如无"latest"，按语义化版本号比较选择最新版本
    fallback: 无法解析版本号时返回(0,)作为默认值
metadata_processing:
  description: 元数据处理逻辑
  supported_fields:
  - tags - Agent标签
  - supported_models - 支持的AI模型列表
  - lib_dependencies - Python库依赖
  - tools_dependencies - Strands工具依赖
  - mcp_dependencies - MCP服务器依赖
  - performance_metrics - 性能指标
  - compatibility - 兼容性配置
  - additional_request_fields - 额外请求字段
  mcp_support:
    description: MCP依赖声明支持
    field_name: mcp_dependencies
    handling:
    - 字段不存在时返回None
    - 字段为空时返回空列表
    - 字段有值时返回值列表
    - 支持单个字符串自动转换为列表
key_features:
  dynamic_loading:
    description: 动态加载机制
    features:
    - 递归扫描prompts目录下所有YAML文件
    - 支持多级目录结构
    - 自动建立agent名称到相对路径的映射
    - 支持通过agent名称或相对路径访问
  hot_reload:
    description: 热重载支持
    methods:
    - reload() - 重新加载所有提示词文件
    - load_single_prompt() - 动态加载单个提示词文件
    use_cases:
    - 运行时添加新Agent无需重启服务
    - 更新提示词内容后动态刷新
    - 开发调试时快速迭代
  path_mapping:
    description: 路径映射机制
    features:
    - 支持agent名称作为key
    - 支持相对路径作为key
    - 双向映射便于查询
    - 自动去除./prompts/前缀和.yaml后缀
