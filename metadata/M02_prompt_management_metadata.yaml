      - compat_data
      is_private: true
      is_property: false
    - name: _parse_metadata
      docstring: '解析元数据


        支持解析 mcp_dependencies 字段：

        - 如果字段不存在，返回 None

        - 如果字段存在但为空，返回空列表

        - 如果字段存在且有值，返回值列表'
      parameters:
      - self
