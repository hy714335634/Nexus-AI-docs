module_info:
  name: prompts_manager
  file_path: nexus_utils/prompts_manager.py
  description: Prompt Management模块 - 负责YAML提示词模板的加载、解析、版本管理和元数据处理
  version: 1.0.0
  last_analyzed: '2026-02-05'
architecture:
  design_pattern: Singleton + Factory
  key_patterns:
  - Singleton Pattern - PromptManager使用单例模式确保全局唯一实例
  - Factory Pattern - PromptManagerRegistry作为工厂管理多个实例
  - Data Class Pattern - 使用@dataclass定义数据结构
  - Template Method Pattern - 统一的YAML解析流程
  core_components:
  - name: PromptManager
    type: Singleton Manager
    responsibility: YAML提示词模板的加载、解析和管理
  - name: PromptAgent
    type: Data Container
    responsibility: Agent提示词的版本管理和环境配置
  - name: PromptVersion
    type: Data Container
    responsibility: 单个版本的提示词内容和元数据
  - name: PromptManagerRegistry
    type: Factory
    responsibility: 管理多个PromptManager实例
data_structures:
  classes:
  - name: EnvironmentConfig
    docstring: 环境配置类
    base_classes: []
    decorators:
    - dataclass
    attributes:
    - temperature
    - max_tokens
    - streaming
    - debug_mode
    methods: []
  - name: ToolConfig
    docstring: 工具配置类
    base_classes: []
    decorators:
    - dataclass
    attributes:
    - name
    - enabled
    - description
    methods: []
  - name: PerformanceMetrics
    docstring: 性能指标类
    base_classes: []
    decorators:
    - dataclass
    attributes:
    - accuracy
    - response_time
    - user_satisfaction
    methods: []
  - name: Compatibility
    docstring: 兼容性配置类
    base_classes: []
    decorators:
    - dataclass
    attributes:
    - min_strands_version
    - supported_models
    methods: []
  - name: Metadata
    docstring: '元数据类


      包含 Agent 的标签、模型支持、依赖项等元数据信息

      新增 mcp_dependencies 字段支持 MCP 依赖声明'
    base_classes: []
    decorators:
    - dataclass
    attributes:
    - tags
    - supported_models
    - lib_dependencies
    - tools_dependencies
    - mcp_dependencies
    - performance_metrics
    - dependencies
    - compatibility
    - additional_request_fields
    methods: []
  - name: Example
    docstring: 示例对话类
    base_classes: []
    decorators:
    - dataclass
    attributes:
    - user
    - assistant
    methods: []
  - name: PromptVersion
    docstring: 提示词版本管理类
    base_classes: []
    decorators:
    - dataclass
    attributes:
    - agent_name
    - version
    - status
    - created_date
    - author
    - description
    - system_prompt
    - user_prompt_template
    - context_window
    - tools
    - constraints
    - examples
    - metadata
    methods: []
  - name: PromptAgent
    docstring: Agent提示词管理类
    base_classes: []
    decorators:
    - dataclass
    attributes:
    - agent_name
    - description
    - category
    - environments
    - versions
    methods:
    - name: get_version
      docstring: 获取指定版本的提示词，默认返回最新版本
      parameters: &id020
      - self
      - version
      is_private: false
      is_property: false
    - name: _version_key
      docstring: 将版本字符串转换为可比较的元组
      parameters:
      - self
      - version_str
      is_private: true
      is_property: false
    - name: get_all_versions
      docstring: 获取所有版本的提示词
      parameters: &id021
      - self
      is_private: false
      is_property: false
    - name: get_environment_config
      docstring: 获取指定环境的配置
      parameters: &id022
      - self
      - environment
      is_private: false
      is_property: false
  - name: PromptManager
    docstring: 提示词管理器类
    base_classes: []
    decorators: []
    attributes: []
    methods:
    - name: __new__
      docstring: ''
      parameters:
      - cls
      - prompt_paths
      is_private: true
      is_property: false
    - name: __init__
      docstring: ''
      parameters:
      - self
      - prompt_paths
      is_private: true
      is_property: false
    - name: _parse_environment_config
      docstring: 解析环境配置
      parameters:
