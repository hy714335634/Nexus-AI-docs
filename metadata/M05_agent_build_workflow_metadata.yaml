core_features:
- 自然语言需求输入
- 7阶段自动化流程
- Agent间上下文传递
- 自动代码生成
- 提示词模板生成
- 工具函数开发
- 项目文档生成
- 交互式和批处理模式
input_output:
  input:
    type: 自然语言描述
    format: 用户需求文本
    example: 请创建一个Agent帮我完成AWS产品报价工作
  output:
    agent_code: agents/generated_agents/{agent_name}/
    prompt_template: prompts/generated_agents_prompts/{agent_name}.yaml
    tools: tools/generated_tools/{agent_name}/
    documentation: projects/{agent_name}/
integration_points:
  agent_factory: 使用Agent Factory创建工作流Agent
  prompt_manager: 加载各阶段Agent的提示词模板
  project_manager: 管理生成的项目文件和目录结构
  tool_templates: 使用工具模板生成新工具代码
usage_modes:
  interactive:
    description: 交互式模式，手动输入需求
    command: python agent_build_workflow.py
  batch:
    description: 批处理模式，直接提供需求
    command: python agent_build_workflow.py -i "需求描述"
